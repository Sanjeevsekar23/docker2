apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-portal
  labels:
    app: department-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: department-portal
  template:
    metadata:
      labels:
        app: department-portal
    spec:
      containers:
        - name: department-portal
          image: sanjeevsekar23/docker2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: department-portal-service
spec:
  type: NodePort
  selector:
    app: department-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30011